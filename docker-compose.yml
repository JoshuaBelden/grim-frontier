services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["bun", "--inspect=0.0.0.0:9229", "--watch", "src/index.ts"]
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/grim-frontier}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      PORT: "3000"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/static:/app/packages/frontend/static
      - ./packages/frontend/svelte.config.js:/app/packages/frontend/svelte.config.js
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
